packages:
  - packages/*
  - tools/*
allowBuilds:
  '@google/genai': true
  protobufjs: true
  unrs-resolver: true
  '@swc/core': true
  nx: true
catalog:
  '@earendil-works/pi-coding-agent': 0.82.1
  '@eslint/js': ^9.8.0
  '@nx/devkit': 23.1.3
  '@nx/eslint': 23.1.3
  '@nx/eslint-plugin': 23.1.3
  '@nx/js': 23.1.3
  '@nx/plugin': 23.1.3
  '@nx/vitest': 23.1.3
  '@swc-node/register': 1.11.1
  '@swc/cli': ~0.8.0
  '@swc/core': 1.15.8
  '@swc/helpers': 0.5.18
  '@types/node': ^24.0.0
  '@typescript/native': 'npm:typescript@~7.0.2'
  '@vitest/coverage-v8': ~4.1.11
  eslint: ^9.8.0
  eslint-config-prettier: ^10.0.0
  jsdom: ^27.1.0
  jsonc-eslint-parser: ^2.1.0
  nx: 23.1.3
  prettier: ^3.8.1
  tslib: ^2.3.0
  typescript: 'npm:@typescript/typescript6@~6.0.2'
  typescript-eslint: ^8.40.0
  vite: ^8.1.5
  vitest: ~4.1.11
overrides:
  '@xhmikosr/decompress': 11.1.4
  axios: 1.20.0
  baseline-browser-mapping: 2.11.0
  brace-expansion: 5.0.12
  browserslist: 4.28.7
  http-cache-semantics: 4.3.0
  'js-yaml@<3.15.0': 3.15.2
  'js-yaml@>=4 <4.3.0': 4.3.2
  nanoid: 3.3.18
  piscina@4: 4.9.4
  postcss: 8.5.23
  protobufjs: 7.6.5
  smol-toml: 1.9.0
  source-map-js: 1.2.2
  undici: 8.10.2
auditConfig:
  ignoreGhsas:
    # sprintf-js has no patched release (latest is 1.1.3). It is reached
    # only via argparse@1 in Jest/Istanbul tooling, with fixed formats.
    - GHSA-hp3w-g68c-fv3c
    # nx migrate path traversal; fixed only in nx 23.2.1, which changes
    # generator formatting. This workspace does not run nx migrate in CI.
    - GHSA-hrvq-x7jp-36xv
minimumReleaseAgeExclude:
  - '@earendil-works/pi-agent-core@0.82.1'
  - '@earendil-works/pi-ai@0.82.1'
  - '@earendil-works/pi-coding-agent@0.82.1'
  - '@earendil-works/pi-tui@0.82.1'
